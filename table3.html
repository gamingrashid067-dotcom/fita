<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product price list</title>
</head>
<body bgcolor="orange">
    <h2 align="center">product list</h2>
    <table border="1" cellpadding="8" cellspacing="0" width="100%" align="center">
        <caption><b>pc gaming stores 2026</b></caption>
        <thead>
            <tr bgcolor="black">
                <th><font color="white">produck</font></th>
                <th><font color="white">category</font></th>
                <th><font color="white">Price</font></th>
                <th><font color="white">stock</font></th>
            </tr>
        </thead>
        <tbody>
            <tr bgcolor="yellow">
                <td>joystrick</td>
                <td>mouse</td>
                <td align="right">1600</td>
                <td align="center">500</td>
            </tr>
            <tr>
                <td>keyboard</td>
                <td>cpu</td>
                <td align="right">2000</td>
                <td align="center">30000</td>
            </tr>
            <tr bgcolor="blue">
                <td colspan="2"> headphone and specker </td>
                <td align="right">4500</td>
                <td align="center">1333</td>
            </tr>
        </tbody>
        <tfoot>
            <tr bgcolor="yellow">
                <td colspan="3" align="right"><b>total items in stock:</b></td>
                <td align="center"><b>177</b></td>

            </tr>
        </tfoot>
</table>
    
</body>
</html>
